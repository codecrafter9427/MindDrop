// Classes the Compose compiler should treat as stable.
//
// The :domain module is deliberately pure Kotlin with no Android or Compose
// dependency, so its models can't be annotated @Immutable directly. Without
// this file the compiler infers Note as unstable (it exposes List<String> tags,
// and List is an interface whose implementation could be mutable), which stops
// NoteCard from skipping recomposition when its note hasn't changed.
//
// These are safe to declare stable: each is a data class or enum whose
// properties are all vals, and the tags list is only ever assigned read-only
// lists built at construction.
com.dins.minddrop.domain.model.Note
com.dins.minddrop.domain.model.NoteFilter
com.dins.minddrop.domain.model.UserPreferences
